<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Gerak Ceria</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#241b4d;--sun:#ffc933;--coral:#ff5d73;--mint:#2ee6a6;--sky:#38bdf8}
*{box-sizing:border-box;margin:0;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:'Baloo 2','Trebuchet MS',sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;display:none;flex-direction:column;justify-content:space-between;padding:1.2vh 1.5vw;pointer-events:none}
.top{display:flex;align-items:center;gap:1.5vw;background:rgba(36,27,77,.88);border-radius:2.5vh;padding:1vh 1.5vw;font-size:3vh;font-weight:800}
.top .grow{flex:1}
#bar{height:1.6vh;background:#ffffff33;border-radius:9px;overflow:hidden;margin-top:.8vh}
#bar i{display:block;height:100%;width:100%;background:var(--mint);transition:background .3s}
#tm{font-size:6vh;line-height:1;min-width:6vh;text-align:center;color:var(--sun)}
#qt{margin:1.2vh auto 0;max-width:80vw;background:#fff;color:var(--ink);border-radius:4vh;padding:2vh 3vw;font-size:4.6vh;line-height:1.15;font-weight:800;text-align:center;box-shadow:0 1vh 0 var(--sun)}
#op{display:grid;gap:2vw;width:100%}
.opt{border-radius:4vh;padding:2.4vh 1.5vw;text-align:center;font-size:4.4vh;font-weight:800;line-height:1.1;position:relative;min-height:16vh;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 1vh 0 #0006;transition:transform .25s}
.opt b{font-size:8vh;line-height:.9;display:block}
.opt small{font-size:2.4vh;font-weight:500;opacity:.85}
.opt .mk{position:absolute;top:-1.6vh;right:1vw;display:flex;gap:.4vw}
.chip{padding:.2vh 1vw;border-radius:3vh;color:#111;font-size:2.6vh;font-weight:800;border:.4vh solid #fff}
.win{transform:scale(1.06);outline:1vh solid #fff}
.dim{opacity:.35}
#fb{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:9vh;font-weight:800;text-align:center;padding:2vh 4vw;border-radius:5vh;background:var(--ink);border:.8vh solid var(--sun);z-index:20;transition:transform .35s cubic-bezier(.3,1.6,.5,1);max-width:90vw;line-height:1.1}
#fb.on{transform:translate(-50%,-50%) scale(1)}
.layer{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2vh;padding:4vh 6vw;background:radial-gradient(circle at 50% 30%,#4a2fa0,var(--ink) 70%)}
.layer.clear{background:linear-gradient(transparent,#241b4dcc 60%);justify-content:flex-end;pointer-events:none;padding-bottom:4vh}
.layer h1{font-size:9vh;line-height:1;color:var(--sun);text-shadow:0 .8vh 0 #0005}
.layer h2{font-size:5vh;line-height:1.1}
.layer p{font-size:3.2vh;max-width:70vw;line-height:1.25;opacity:.95}
.btn{pointer-events:auto;cursor:pointer;border:0;font:inherit;font-weight:800;font-size:5vh;color:var(--ink);background:var(--sun);border-radius:6vh;padding:1.4vh 5vw;box-shadow:0 1vh 0 #b8860b;transition:transform .1s}
.btn:active{transform:translateY(.8vh);box-shadow:0 .2vh 0 #b8860b}
.btn.alt{background:#fff;font-size:3vh;box-shadow:0 .8vh 0 #8888}
.btn[disabled]{opacity:.4}
.dude{font-size:14vh;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2vh) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.dude{animation:none}.opt,#fb{transition:none}}

.brand-badge{font-size:2.2vh;font-weight:800;color:var(--sun);background:#241b4d;padding:.4vh 1.4vw;border-radius:2vh;border:.25vh solid #ffffff33;display:inline-flex;align-items:center;gap:.6vw}
#confetti-cv{position:fixed;inset:0;pointer-events:none;z-index:45}
</style>
</head>
<body>
<video id="v" playsinline muted style="display:none"></video>
<canvas id="cv"></canvas>
<canvas id="confetti-cv"></canvas>

<div id="hud">
  <div>
    <div class="top"><span id="rl"></span><span class="brand-badge">⚡ NalarSci AI</span><span class="grow"></span><span id="st"></span><span class="grow"></span><span id="qn"></span><span id="tm">8</span></div>
    <div id="bar"><i></i></div>
    <div id="qt"></div>
  </div>
  <div id="op"></div>
</div>
<div id="fb"></div>

<!-- Layar awal -->
<div class="layer" id="start" style="display:flex">
  <div class="dude">🤸</div>
  <h1>Kuis Gerak Ceria</h1><div class="brand-badge" style="font-size:2.8vh;margin-top:-1vh">⚡ NalarSci Motion AI • Karya: Thomas Ryantama, M.Kom., Gr. • Edufair 2026</div>
  <p id="sm">Menyiapkan kamera dan kecerdasan buatan… mohon izinkan kamera.</p>
  <div style="display:flex;gap:2vw"><button class="btn" id="go" disabled>Siap Main!</button><button class="btn alt" onclick="document.documentElement.requestFullscreen?.()">Layar penuh</button></div>
</div>

<!-- Lobi (kamera terlihat) -->
<div class="layer clear" id="lobby">
  <h2>Berdiri berjajar di depan kamera!</h2>
  <p id="lc">Belum ada pemain terdeteksi</p>
  <button class="btn" id="go1">Mulai Babak 1</button>
</div>

<!-- Layar pesan -->
<div class="layer" id="msg"><div class="dude" id="me">🎉</div><h1 id="mt"></h1><p id="mp"></p><button class="btn" id="mb"></button></div>

<script type="module">
import {FilesetResolver,PoseLandmarker,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),vid=$('v');
const COL=['#ffc933','#ff5d73','#38bdf8','#a3e635','#c084fc','#fb923c'];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

/* ---------- Bank soal ---------- */
// Babak 1: pilih A (kiri) atau B (kanan). Format: [soal, jawaban benar, jawaban salah]
const B1=[
["Siapa yang membuat bahtera besar saat air bah?","Nuh","Musa"],
["Berapa jumlah murid Yesus?","12","7"],
["Hewan manakah yang makan rumput (Herbivora)?","Sapi","Singa"],
["Kita tinggal di planet...","Bumi","Mars"],
["Yesus lahir di kota...","Betlehem","Yerusalem"],
["Berapa hasil 2 + 3 × 2 ?","8","10"],
["Siapa yang mengalahkan raksasa Goliat dengan ketapel?","Daud","Simson"],
["Warna pelangi ada berapa macam?","7","5"],
["Natal diperingati setiap tanggal...","25 Desember","17 Agustus"],
["Sila pertama Pancasila adalah...","Ketuhanan Yang Maha Esa","Persatuan Indonesia"],
["Siapa yang dimasukkan ke gua singa tetapi selamat?","Daniel","Petrus"],
["Alat untuk melihat benda langit yang sangat jauh?","Teleskop","Mikroskop"],
["Perangkat komputer untuk mengetik huruf dan angka?","Keyboard","Monitor"],
["Tombol keyboard untuk membatalkan perintah (Undo)?","CTRL + Z","CTRL + P"],
["Pulau terbesar di Indonesia yang memiliki fauna orangutan?","Kalimantan","Bali"],
["Gas yang kita hirup saat bernapas adalah...","Oksigen (O₂)","Karbon Dioksida"],
["Monumen Nasional (Monas) berada di kota...","Jakarta","Surabaya"],
["Mata uang resmi negara Indonesia adalah...","Rupiah","Ringgit"],
["Hewan tercepat di darat adalah...","Cheetah","Gajah"],
["Air membeku menjadi es pada suhu...","0°C","100°C"]
].map(([q,r,w])=>Math.random()<.5?{q,A:r,B:w,a:0}:{q,A:w,B:r,a:1});
// Babak 2: 4 pilihan, jawab dengan 1-4 jari. Format: [soal, pilihan, indeks benar]
const B2=[
["Siapa nabi yang ditelan oleh ikan besar?",["Yunus","Daniel","Petrus","Paulus"],0],
["Tuhan Yesus beristirahat pada hari ke...?",["Ke-3","Ke-5","Ke-7","Ke-10"],2],
["Siapakah nama ibu dari Tuhan Yesus?",["Maria","Marta","Hawa","Sara"],0],
["Berapa hasil perkalian dari 7 × 8 ?",["54","56","64","48"],1],
["Siapa tokoh yang membelah Laut Teberau dengan tongkat?",["Daud","Elia","Yosua","Musa"],3],
["Hewan manakah yang bertelur dan bisa terbang?",["Kucing","Burung","Paus","Sapi"],1],
["Warna bendera kebangsaan Indonesia adalah...?",["Merah-Putih","Biru-Putih","Merah-Kuning","Hijau-Putih"],0],
["Bagian tumbuhan yang menyerap air dari dalam tanah?",["Daun","Bunga","Akar","Buah"],2],
["Perangkat keras yang menjadi otak pengolah komputer?",["CPU","Speaker","Mouse","Printer"],0],
["Ibu kota negara Indonesia di masa depan adalah...?",["IKN Nusantara","Bandung","Medan","Surabaya"],0],
["Planet terbesar di dalam tata surya kita adalah...?",["Mars","Jupiter","Venus","Merkurius"],1],
["Berapa jumlah warna pada lampu lalu lintas jalan raya?",["2 Warna","3 Warna","4 Warna","5 Warna"],1]
];

/* ---------- Status ---------- */
let pose,hand,phase='load',round=1,players=[],fin=[],qs=[],qi=0,cur=null,tEnd=0,TM=8,pr=null,hr=null,lastT=-1,zs=[],ac;
const beep=(f,d=.12,t='sine')=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const jingle=(a)=>a.forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*130));
const show=(id,on=true)=>$(id).style.display=on?'flex':'none';
let fbT;const toast=(t,ms=1800)=>{const f=$('fb');f.innerHTML=t;f.classList.add('on');clearTimeout(fbT);fbT=setTimeout(()=>f.classList.remove('on'),ms)};
const msg=(e,t,p,b,fn)=>{$('me').textContent=e;$('mt').textContent=t;$('mp').innerHTML=p;$('mb').textContent=b;$('mb').onclick=()=>{show('msg',false);fn()};show('msg')};

/* ---------- Muat kamera + model ---------- */
async function init(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});
    vid.srcObject=s;await vid.play();
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const M="https://storage.googleapis.com/mediapipe-models/";
    pose=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M+"pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses:6});
    hand=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M+"hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:4});
    $('sm').textContent="Babak 1: lompat ke kiri atau kanan. Babak 2: jawab dengan jari!";
    $('go').disabled=false;phase='ready';
  }catch(e){$('sm').textContent="Kamera belum bisa dipakai. Izinkan akses kamera di browser, lalu muat ulang halaman. ("+e.message+")"}
}
$('go').onclick=()=>{beep(660);show('start',false);toLobby()};
init();

/* ---------- Lobi & Babak 1 ---------- */
function toLobby(){round=1;players=[];fin=[];phase='lobby';show('lobby');$('hud').style.display='none'}
$('go1').onclick=()=>{
  const n=players.filter(p=>performance.now()-p.seen<1500).length;
  if(!n){toast('Belum ada pemain terlihat 👀');return}
  players=players.filter(p=>performance.now()-p.seen<1500);players.forEach((p,i)=>{p.id=i+1;p.alive=true});
  show('lobby',false);beep(880);
  if(players.length<=2){fin=players;msg('✋','Langsung Babak 2!',`Hanya ${players.length} pemain, jadi kalian langsung bertanding dengan jari.`,'Lanjut',intro2)}
  else{qs=shuffle(B1);qi=0;TM=8;$('hud').style.display='flex';$('op').style.cssText='';round=1;countdown(nextQ1)}
};
function countdown(fn){phase='wait';let n=3;(function t(){if(n){toast(n,900);beep(500+n*80);n--;setTimeout(t,900)}else{toast('Mulai! 🚀',700);fn()}})()}

function trackPose(r){
  const now=performance.now();
  const dets=(r.landmarks||[]).map(l=>({x:1-(l[11].x+l[12].x+l[23].x+l[24].x)/4,hx:1-l[0].x,hy:l[0].y}));
  const used=new Set();
  players.forEach(p=>{let b=-1,bd=.18;dets.forEach((d,i)=>{const dd=Math.abs(d.x-p.x);if(!used.has(i)&&dd<bd){bd=dd;b=i}});if(b>=0){used.add(b);Object.assign(p,dets[b],{seen:now})}});
  if(phase==='lobby'){
    dets.forEach((d,i)=>{if(!used.has(i)&&players.length<6)players.push({...d,id:0,seen:now,alive:true})});
    players=players.filter(p=>now-p.seen<1500);players.forEach((p,i)=>p.id=i+1);
  }
}
const side=x=>x<.45?0:x>.55?1:-1;

function nextQ1(){
  const alive=players.filter(p=>p.alive);
  if(alive.length<=2||qi>=qs.length){
    fin=alive.sort((a,b)=>Math.abs(a.x-.5)-Math.abs(b.x-.5)).slice(0,2).sort((a,b)=>a.x-b.x);
    $('hud').style.display='none';jingle([523,659,784,1047]);
    return msg('🏅','Babak 1 selesai!',`Pemain yang lolos: <b>${fin.map(p=>'P'+p.id).join(' dan ')}</b>. Selamat! Sekarang saatnya pakai jari.`,'Ke Babak 2',intro2);
  }
  cur=qs[qi++];phase='q';
  $('rl').textContent='🏃 Babak 1';$('qn').textContent=`Soal ${qi}`;$('st').textContent=`👥 Bertahan: ${alive.length}`;
  $('qt').textContent=cur.q;
  $('op').style.gridTemplateColumns='1fr 1fr';
  $('op').innerHTML=`<div class="opt" style="background:#1d7fd6"><b>A</b>${cur.A}<small>⬅️ lompat ke kiri</small></div><div class="opt" style="background:#12a874"><b>B</b>${cur.B}<small>lompat ke kanan ➡️</small></div>`;
  TM=8;tEnd=performance.now()+TM*1000;
}
function eval1(){
  phase='reveal';const now=performance.now();
  const alive=players.filter(p=>p.alive);
  const ok=alive.filter(p=>now-p.seen<1500&&side(p.x)===cur.a);
  [...$('op').children].forEach((c,i)=>c.classList.add(i===cur.a?'win':'dim'));
  const jawab='AB'[cur.a];
  if(!ok.length){toast(`Semua salah! Jawabannya ${jawab}. Tidak ada yang gugur 😅`,2600);beep(200,.4,'sawtooth')}
  else{
    const out=alive.filter(p=>!ok.includes(p));out.forEach(p=>p.alive=false);
    if(out.length){toast(`✅ Jawaban ${jawab}<br>Gugur: ${out.map(p=>'P'+p.id).join(', ')} 😢`,2600);beep(220,.4,'sawtooth')}
    else{toast(`🎉 Hebat! Semua benar (${jawab})`,2600);jingle([523,659,784])}
  }
  setTimeout(nextQ1,3200);
}

/* ---------- Babak 2: jari ---------- */
function intro2(){
  round=2;phase='wait';$('hud').style.display='none';
  const two=fin.length===2;
  msg('🖐️','Babak 2: Pakai Jari!',`Angkat <b>1 jari = A</b>, <b>2 jari = B</b>, <b>3 jari = C</b>, <b>4 jari = D</b>. Tahan sampai terkunci.<br>${two?'P'+fin[0].id+' bermain di layar kiri, P'+fin[1].id+' di layar kanan.':'Angkat tanganmu di depan kamera.'}`,'Mulai!',()=>{
    fin.forEach(p=>p.score=0);qs=shuffle(B2).slice(0,6);qi=0;TM=12;$('hud').style.display='flex';countdown(nextQ2)});
}
function nextQ2(){
  if(qi>=qs.length)return end2();
  const [q,o,a]=qs[qi++];cur={q,o,a};phase='q';
  zs=fin.map(()=>({cur:0,prev:0,since:0,lock:false,ans:-1,t:0}));
  $('rl').textContent='🖐️ Babak 2';$('qn').textContent=`Soal ${qi}/${qs.length}`;
  $('qt').textContent=q;
  $('op').style.gridTemplateColumns='repeat(4,1fr)';
  const bg=['#1d7fd6','#12a874','#e08a00','#c0397f'];
  $('op').innerHTML=o.map((t,i)=>`<div class="opt" style="background:${bg[i]}"><span class="mk" id="m${i}"></span><b>${'ABCD'[i]}</b>${t}<small>${i+1} jari</small></div>`).join('');
  scoreboard();TM=12;tEnd=performance.now()+TM*1000;
}
const scoreboard=()=>$('st').innerHTML=fin.map(p=>`<span style="color:${COL[p.id-1]}">P${p.id}: ${p.score}⭐</span>`).join(' &nbsp; ');
function fing(l){const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),w=l[0];let n=0;[[8,6],[12,10],[16,14],[20,18]].forEach(([t,p])=>{if(d(l[t],w)>d(l[p],w)*1.05)n++});return n}
function trackHands(r,now){
  zs.forEach(z=>z.cur=0);
  (r.landmarks||[]).forEach(l=>{
    const wx=1-l[0].x,zi=fin.length===2?(wx>.5?1:0):0,z=zs[zi];if(!z||z.lock)return;
    z.cur=fing(l);z.wx=wx*cv.width;z.wy=l[0].y*cv.height;
  });
  zs.forEach(z=>{
    if(z.lock)return;
    if(z.cur>0&&z.cur===z.prev){z.hold=now-z.since;if(z.hold>=900){z.lock=true;z.ans=z.cur-1;z.t=now;beep(880,.15)}}
    else{z.since=now;z.hold=0}
    z.prev=z.cur;
  });
  if(zs.every(z=>z.lock)&&phase==='q')tEnd=Math.min(tEnd,now+700);
}
function eval2(){
  phase='reveal';const now=performance.now();let res=[];
  zs.forEach((z,i)=>{
    let ans=z.lock?z.ans:(z.cur>0?z.cur-1:-1),ok=ans===cur.a;
    if(ok)fin[i].score+=10+(z.lock?Math.max(0,Math.ceil((tEnd-z.t)/1000)):0);
    res.push(ok);
  });
  scoreboard();
  [...$('op').children].forEach((c,i)=>c.classList.add(i===cur.a?'win':'dim'));
  const r=fin.map((p,i)=>`P${p.id} ${res[i]?'✅':'❌'}`).join(' &nbsp; ');
  toast(`Jawaban: ${'ABCD'[cur.a]}<br>${r}`,2600);res.some(x=>x)?jingle([523,659,784]):beep(200,.4,'sawtooth');
  setTimeout(nextQ2,3200);
}

/* ---------- Confetti Cannon Engine ---------- */
const ccv = $('confetti-cv'), cctx = ccv.getContext('2d');
let cParts = [];
function fireConfetti(){
  ccv.width = innerWidth; ccv.height = innerHeight;
  cParts = [];
  const colors = ['#ffc933','#ff5d73','#38bdf8','#2ee6a6','#c084fc','#fb923c','#ffffff'];
  for(let i=0; i<120; i++){
    cParts.push({
      x: innerWidth/2, y: innerHeight/2,
      vx: (Math.random()-0.5)*24,
      vy: (Math.random()-0.8)*22,
      size: Math.random()*12 + 6,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*14,
      alpha: 1
    });
  }
  animConfetti();
}
function animConfetti(){
  if(!cParts.length) return;
  cctx.clearRect(0,0,ccv.width,ccv.height);
  cParts.forEach((p, idx)=>{
    p.x += p.vx; p.y += p.vy; p.vy += 0.45;
    p.rot += p.rotSpeed; p.alpha -= 0.012;
    cctx.save();
    cctx.globalAlpha = Math.max(0, p.alpha);
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    cctx.restore();
    if(p.alpha<=0) cParts.splice(idx,1);
  });
  if(cParts.length) requestAnimationFrame(animConfetti);
  else cctx.clearRect(0,0,ccv.width,ccv.height);
}

function end2(){
  phase='end';$('hud').style.display='none';
  jingle([523,659,784,1047,1319]);
  fireConfetti();
  const s=[...fin].sort((a,b)=>b.score-a.score);
  let t,p;
  if(fin.length===1){
    t='Juara Edufair 2026! 🏆';
    p=`Pemain P${fin[0].id} meraih <b>${fin[0].score} ⭐</b>!<br><span style="font-size:2.4vh;color:var(--mint);font-weight:800">⚡ NalarSci Motion AI • Karya: Thomas Ryantama, M.Kom., Gr.</span><br><small style="font-size:2vh;opacity:.8">SD Methodist Immanuel • nalarsci.id</small>`;
  } else if(s[0].score===s[1].score){
    t='Juara Bersama! 🤝';
    p=`P${s[0].id} dan P${s[1].id} sama-sama meraih <b>${s[0].score} ⭐</b>!<br><span style="font-size:2.4vh;color:var(--mint);font-weight:800">⚡ NalarSci Motion AI • Karya: Thomas Ryantama, M.Kom., Gr.</span><br><small style="font-size:2vh;opacity:.8">SD Methodist Immanuel • nalarsci.id</small>`;
  } else {
    t=`P${s[0].id} Juara 1 Edufair! 🏆`;
    p=`<b>P${s[0].id}: ${s[0].score} ⭐</b> &nbsp;•&nbsp; P${s[1].id}: ${s[1].score} ⭐<br><span style="font-size:2.4vh;color:var(--mint);font-weight:800">⚡ NalarSci Motion AI • Karya: Thomas Ryantama, M.Kom., Gr.</span><br><small style="font-size:2vh;opacity:.8">SD Methodist Immanuel • nalarsci.id</small>`;
  }
  msg('🏆',t,p,'Main Lagi 🔄',toLobby);
}

/* ---------- Loop gambar & deteksi ---------- */
function loop(){
  requestAnimationFrame(loop);
  const W=cv.width=innerWidth,H=cv.height=innerHeight,now=performance.now();
  if(vid.readyState>=2){
    ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(vid,0,0,W,H);ctx.restore();
    ctx.fillStyle='rgba(36,27,77,.25)';ctx.fillRect(0,0,W,H);
    if(vid.currentTime!==lastT&&pose&&phase!=='load'){
      lastT=vid.currentTime;
      if(round===1){pr=pose.detectForVideo(vid,now);trackPose(pr)}
      else{hr=hand.detectForVideo(vid,now);if(phase==='q')trackHands(hr,now)}
    }
  }
  // Zona
  if(round===1&&(phase==='q'||phase==='reveal')){
    ctx.fillStyle='rgba(29,127,214,.28)';ctx.fillRect(0,0,W*.45,H);
    ctx.fillStyle='rgba(18,168,116,.28)';ctx.fillRect(W*.55,0,W*.45,H);
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(W*.45,0,W*.1,H);
    ctx.font=`800 ${H*.3}px 'Baloo 2'`;ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.22)';
    ctx.fillText('A',W*.225,H*.62);ctx.fillText('B',W*.775,H*.62);
  }
  if(round===2&&fin.length===2&&phase!=='load'){ctx.fillStyle='#fff6';ctx.fillRect(W/2-2,0,4,H)}
  // Pemain babak 1
  if(round===1)players.forEach(p=>{
    if(now-p.seen>1500)return;
    const x=p.hx*W,y=p.hy*H-H*.09,c=COL[p.id-1],live=p.alive;
    ctx.beginPath();ctx.arc(x,y,H*.045,0,7);ctx.fillStyle=live?c:'#777';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.fillStyle='#241b4d';ctx.font=`800 ${H*.045}px 'Baloo 2'`;ctx.textAlign='center';ctx.fillText(live?'P'+p.id:'❌',x,y+H*.016);
    if(live&&phase==='q'){const s=side(p.x);ctx.fillStyle=s<0?'#fff':c;ctx.font=`800 ${H*.04}px 'Baloo 2'`;ctx.fillText(s<0?'?':'AB'[s],x,y-H*.06)}
  });
  // Lobi
  if(phase==='lobby'){const n=players.length;$('lc').textContent=n?`Terdeteksi ${n} pemain. ${n>2?'Yang gugur akan tersaring sampai tersisa 2 pemain.':'Dengan 1–2 pemain, langsung ke Babak 2.'}`:'Belum ada pemain terdeteksi. Mundur sedikit supaya seluruh badan terlihat.'}
  // Tangan babak 2
  if(round===2&&hr&&(phase==='q'||phase==='reveal')){
    (hr.landmarks||[]).forEach(l=>{
      const wx=1-l[0].x,zi=fin.length===2?(wx>.5?1:0):0,z=zs[zi],c=COL[fin[zi]?fin[zi].id-1:0],x=wx*W,y=l[0].y*H;
      const n=fing(l);ctx.beginPath();ctx.arc(x,y-H*.08,H*.06,0,7);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();
      ctx.fillStyle='#241b4d';ctx.font=`800 ${H*.07}px 'Baloo 2'`;ctx.textAlign='center';ctx.fillText(n?'ABCD'[n-1]:'–',x,y-H*.055);
      if(z&&!z.lock&&z.hold){ctx.beginPath();ctx.arc(x,y-H*.08,H*.075,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,z.hold/900));ctx.strokeStyle='#2ee6a6';ctx.lineWidth=10;ctx.stroke()}
    });
    // Penanda pilihan di kartu
    if(phase==='q')for(let i=0;i<4;i++){const m=$('m'+i);if(m)m.innerHTML=zs.map((z,k)=>{const a=z.lock?z.ans:z.cur-1;return a===i?`<span class="chip" style="background:${COL[fin[k].id-1]}">P${fin[k].id}${z.lock?' ✅':''}</span>`:''}).join('')}
  }
  // Pewaktu
  if(phase==='q'){
    const rem=Math.max(0,(tEnd-now)/1000);
    $('tm').textContent=Math.ceil(rem);$('bar').firstElementChild.style.width=rem/TM*100+'%';
    $('bar').firstElementChild.style.background=rem<3?'var(--coral)':'var(--mint)';
    if(rem<=3&&Math.ceil(rem)!==loop.l){loop.l=Math.ceil(rem);if(rem>0)beep(440,.08)}
    if(rem<=0)round===1?eval1():eval2();
  }
}
loop();
</script>
