<script>
  const API_GURU_URL = "https://script.google.com/macros/s/AKfycbzzCHn0XFkiPNWm-I4opfmS2V9d9PNYPStNTUnUd2-TWPqQBksuWoQcTzb6O9ZFN6RgyA/exec";

  const video = document.getElementById('video-feed');
  let labeledFaceDescriptors = [];
  let faceMatcher = null;
  let isProcessing = false;
  let cooldownTimer = {};
  let targetAksiAdmin = "";
  let tokenAdminSementara = null;
  let daftarMasterGuruCache = [];
  let dataServerPresensi = { riwayatLog: [] };

  window.addEventListener('DOMContentLoaded', async () => {
    // Bersihkan sisa data lokal uji coba sebelumnya agar tidak false-detection
    localStorage.removeItem('db_wajah_guru');

    try {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);

      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;

      video.addEventListener('play', () => {
        document.getElementById('camera-loading').classList.add('hidden');
        mulaiPemindaianLoop();
      });

      // Tarik database nama & vektor biometrik dari Google Spreadsheet Cloud
      await sinkronisasiBiometrikDariCloud();

    } catch (err) {
      document.getElementById('loading-msg').innerHTML = `<span class="text-rose-400">Gagal kamera: ${err.message}</span>`;
    }
  });

  // Tarik Vektor Wajah dari Google Spreadsheet
  async function sinkronisasiBiometrikDariCloud() {
    try {
      document.getElementById('feedback-sub').innerText = "Menyinkronkan data biometrik dari server Google...";
      const r = await fetch(API_GURU_URL);
      const res = await r.json();

      if (res.status === "success" && res.daftarGuru) {
        daftarMasterGuruCache = res.daftarGuru;

        // Isi dropdown nama master
        const select = document.getElementById('select-nama-master');
        let opt = '<option value="">-- Pilih dari Daftar Nama Master --</option>';
        res.daftarGuru.forEach(g => {
          const statusVektor = (g.vektorWajah && g.vektorWajah.length > 0) ? "✅ Siap" : "⚠️ Belum Ada Wajah";
          opt += `<option value="${g.nama}" data-role="${g.role}" data-wa="${g.wa}">${g.nama} (${g.role}) - ${statusVektor}</option>`;
        });
        opt += '<option value="__manual__">➕ Ketik Nama Baru Lainnya...</option>';
        select.innerHTML = opt;

        // Muat Vektor Biometrik ke FaceMatcher AI
        const descriptorsValid = [];
        res.daftarGuru.forEach(g => {
          if (g.vektorWajah && g.vektorWajah.length === 128) {
            descriptorsValid.push(new faceapi.LabeledFaceDescriptors(g.nama, [new Float32Array(g.vektorWajah)]));
          }
        });

        if (descriptorsValid.length > 0) {
          faceMatcher = new faceapi.FaceMatcher(descriptorsValid, 0.45);
          document.getElementById('feedback-sub').innerText = `Terhubung! ${descriptorsValid.length} wajah guru aktif terdaftar.`;
        } else {
          faceMatcher = null;
          document.getElementById('feedback-sub').innerText = "Database wajah masih kosong. Silakan daftarkan wajah terlebih dahulu.";
        }
      }
    } catch (e) {
      console.error("Gagal sinkron cloud:", e);
      document.getElementById('feedback-sub').innerText = "Gagal mengambil data dari Google Spreadsheet.";
    }
  }

  function mulaiPemindaianLoop() {
    setInterval(async () => {
      if (isProcessing) return;

      const detections = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

      if (detections) {
        if (!faceMatcher) {
          document.getElementById('feedback-main').innerText = "Database Biometrik Kosong";
          document.getElementById('feedback-sub').innerText = "Silakan klik Daftarkan Wajah untuk merekam data ke Spreadsheet.";
          return;
        }

        const match = faceMatcher.findBestMatch(detections.descriptor);
        if (match.label !== 'unknown' && match.distance < 0.45) {
          eksekusiPresensiSukses(match.label);
        } else {
          document.getElementById('feedback-main').innerText = "Wajah Belum Terdaftar";
          document.getElementById('feedback-sub').innerText = "Wajah terdeteksi namun belum cocok dengan database.";
        }
      } else {
        document.getElementById('feedback-main').innerText = "Menunggu Wajah...";
        document.getElementById('feedback-sub').innerText = "Posisikan wajah menghadap kamera lobi";
      }
    }, 500);
  }

  async function eksekusiPresensiSukses(namaGuru) {
    const now = Date.now();
    if (cooldownTimer[namaGuru] && (now - cooldownTimer[namaGuru] < 60000)) return;
    cooldownTimer[namaGuru] = now;
    isProcessing = true;

    const tipeAbsen = document.getElementById('pilih-tipe').value;
    document.getElementById('feedback-main').innerText = `✅ Teridentifikasi: ${namaGuru}`;
    document.getElementById('feedback-sub').innerText = `Merekam presensi ${tipeAbsen} ke server...`;

    ucapkanSapaan(namaGuru, tipeAbsen);

    try {
      const resp = await fetch(API_GURU_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ namaGuru: namaGuru, tipe: tipeAbsen, keterangan: "Presensi Wajah Pos Lobi" })
      });
      const res = await resp.json();
      if (res.status === "success") {
        tambahRiwayatTerkini(namaGuru, res.waktu, res.statusPresensi, tipeAbsen);
      }
    } catch (e) {
      console.error(e);
    } finally {
      setTimeout(() => { isProcessing = false; }, 3000);
    }
  }

  function ucapkanSapaan(nama, tipe) {
    if ('speechSynthesis' in window) {
      const ucapan = new SpeechSynthesisUtterance();
      ucapan.lang = 'id-ID';
      ucapan.rate = 1.0;
      ucapan.text = tipe === 'Masuk' ? `Selamat pagi ${nama}, selamat bertugas.` : `Terima kasih ${nama}, selamat beristirahat.`;
      window.speechSynthesis.speak(ucapan);
    }
  }

  function tambahRiwayatTerkini(nama, waktu, status, tipe) {
    const box = document.getElementById('history-box');
    const item = document.createElement('div');
    item.className = "p-3 bg-slate-900/90 rounded-2xl border border-teal-900/80 flex justify-between items-center text-xs";
    item.innerHTML = `
      <div>
        <p class="font-bold text-white">${nama}</p>
        <p class="text-[10px] text-slate-400">${tipe} • ${waktu}</p>
      </div>
      <span class="px-2 py-0.5 rounded text-[10px] font-bold ${status === 'Terlambat' ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}">
        ${status}
      </span>
    `;
    box.prepend(item);
    if (box.children.length > 3) box.removeChild(box.lastChild);
  }

  // ================= OTORISASI PIN ADMIN =================
  function mintaAksesAdmin(aksi) {
    targetAksiAdmin = aksi;
    if (tokenAdminSementara) {
      if (targetAksiAdmin === 'enroll') bukaModalEnrollment();
      if (targetAksiAdmin === 'rekap') bukaModalRekap();
    } else {
      document.getElementById('modal-auth').classList.remove('hidden');
      document.getElementById('input-pin-auth').value = "";
      document.getElementById('input-pin-auth').focus();
    }
  }

  function tutupModalAuth() {
    document.getElementById('modal-auth').classList.add('hidden');
  }

  async function verifikasiPinAdmin(e) {
    e.preventDefault();
    const inputPin = document.getElementById('input-pin-auth').value.trim();
    const submitBtn = e.target.querySelector('button[type="submit"]');

    if (!inputPin) return;

    submitBtn.disabled = true;
    submitBtn.innerText = "Memverifikasi...";

    try {
      const resp = await fetch(API_GURU_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "verifikasi_admin", pin: inputPin })
      });
      const res = await resp.json();

      if (res.status === "success") {
        tokenAdminSementara = inputPin;
        tutupModalAuth();
        if (targetAksiAdmin === 'enroll') bukaModalEnrollment();
        if (targetAksiAdmin === 'rekap') bukaModalRekap();
      } else {
        alert("⚠️ Akses Ditolak: PIN Admin salah!");
        document.getElementById('input-pin-auth').value = "";
      }
    } catch (err) {
      alert("Gagal otorisasi: " + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Buka";
    }
  }

  function sinkronisasiNamaMaster() {
    const select = document.getElementById('select-nama-master');
    const boxManual = document.getElementById('box-nama-manual');
    const val = select.value;

    if (val === "__manual__") {
      boxManual.classList.remove('hidden');
      document.getElementById('input-nama-guru').value = "";
      document.getElementById('input-wa-guru').value = "";
    } else if (val) {
      boxManual.classList.add('hidden');
      document.getElementById('input-nama-guru').value = val;
      const optTerpilih = select.options[select.selectedIndex];
      const role = optTerpilih.dataset.role;
      const wa = optTerpilih.dataset.wa;
      if (role) document.getElementById('select-role-guru').value = role;
      if (wa && wa !== "-") document.getElementById('input-wa-guru').value = wa;
    } else {
      boxManual.classList.remove('hidden');
    }
  }

  function bukaModalEnrollment() {
    document.getElementById('modal-enroll').classList.remove('hidden');
  }

  function tutupModalEnrollment() {
    document.getElementById('modal-enroll').classList.add('hidden');
    document.getElementById('input-nama-guru').value = "";
    document.getElementById('input-wa-guru').value = "";
    document.getElementById('select-nama-master').value = "";
  }

  // Rekam Wajah dan Simpan ke Google Spreadsheet
  async function rekamVektorWajah() {
    let nama = document.getElementById('input-nama-guru').value.trim();
    const role = document.getElementById('select-role-guru').value;
    const wa = document.getElementById('input-wa-guru').value.trim() || "-";

    if (!nama) {
      alert("Pilih atau ketikkan nama lengkap terlebih dahulu!");
      return;
    }

    const btn = document.getElementById('btn-rekam');
    btn.disabled = true;
    btn.innerText = "⏳ Memindai biometrik 128 titik wajah...";

    const detections = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
    if (!detections) {
      alert("Wajah tidak terdeteksi! Harap menatap lurus ke kamera.");
      btn.disabled = false;
      btn.innerText = "Pindai Wajah & Daftarkan";
      return;
    }

    const descArray = Array.from(detections.descriptor);

    btn.innerText = "⏳ Mengunggah biometrik ke Google Spreadsheet...";
    try {
      const resp = await fetch(API_GURU_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "tambah_guru_master",
          pin: tokenAdminSementara,
          namaGuru: nama,
          role: role,
          wa: wa,
          vektorWajah: descArray
        })
      });

      const res = await resp.json();
      if (res.status === "success") {
        alert(`✅ Sempurna! Biometrik wajah ${nama} berhasil disimpan ke Spreadsheet.`);
        tutupModalEnrollment();
        await sinkronisasiBiometrikDariCloud();
      } else {
        alert("Gagal: " + res.message);
      }
    } catch (err) {
      alert("Kesalahan koneksi: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Pindai Wajah & Daftarkan";
    }
  }

  // ================= REKAP SERVER & FILTER TANGGAL LENGKAP =================
  function bukaModalRekap() {
    document.getElementById('modal-rekap').classList.remove('hidden');
    sesuaikanFilterPeriode();
    tarikDataRekapServer();
  }

  function tutupModalRekap() {
    document.getElementById('modal-rekap').classList.add('hidden');
  }

  async function tarikDataRekapServer() {
    if (!tokenAdminSementara) return;

    const tbody = document.getElementById('tbody-rekap-guru');
    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-teal-400 font-bold">⏳ Mengambil data presensi dari server...</td></tr>`;

    try {
      const resp = await fetch(API_GURU_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "ambil_rekap_admin",
          pin: tokenAdminSementara
        })
      });
      const res = await resp.json();
      if (res.status === "success") {
        dataServerPresensi.riwayatLog = res.riwayatLog || [];
        filterTabelRekap();
      } else {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-rose-400 font-bold">${res.message}</td></tr>`;
      }
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-rose-400">Gagal memuat rekap: ${e.message}</td></tr>`;
    }
  }

  function sesuaikanFilterPeriode() {
    const tipe = document.getElementById('filter-periode-tipe').value;
    const box = document.getElementById('box-subfilter');
    const now = new Date();
    const tglSekarang = now.toISOString().split('T')[0];
    const blnSekarang = String(now.getMonth() + 1).padStart(2, '0');

    if (tipe === 'hari') {
      box.innerHTML = `<label class="block text-[10px] text-slate-400 font-bold mb-1">Tanggal:</label><input type="date" id="param-tgl" value="${tglSekarang}" onchange="filterTabelRekap()" class="w-full p-2 rounded-xl bg-slate-900 border border-teal-800 text-white text-xs outline-none focus:border-teal-400">`;
    } else if (tipe === 'bulan') {
      box.innerHTML = `
        <label class="block text-[10px] text-slate-400 font-bold mb-1">Bulan:</label>
        <select id="param-bln" onchange="filterTabelRekap()" class="w-full p-2 rounded-xl bg-slate-900 border border-teal-800 text-white text-xs outline-none focus:border-teal-400">
          <option value="01" ${blnSekarang==='01'?'selected':''}>Januari</option>
          <option value="02" ${blnSekarang==='02'?'selected':''}>Februari</option>
          <option value="03" ${blnSekarang==='03'?'selected':''}>Maret</option>
          <option value="04" ${blnSekarang==='04'?'selected':''}>April</option>
          <option value="05" ${blnSekarang==='05'?'selected':''}>Mei</option>
          <option value="06" ${blnSekarang==='06'?'selected':''}>Juni</option>
          <option value="07" ${blnSekarang==='07'?'selected':''}>Juli</option>
          <option value="08" ${blnSekarang==='08'?'selected':''}>Agustus</option>
          <option value="09" ${blnSekarang==='09'?'selected':''}>September</option>
          <option value="10" ${blnSekarang==='10'?'selected':''}>Oktober</option>
          <option value="11" ${blnSekarang==='11'?'selected':''}>November</option>
          <option value="12" ${blnSekarang==='12'?'selected':''}>Desember</option>
        </select>
      `;
    } else if (tipe === 'semester') {
      const isGanjil = (now.getMonth() + 1) >= 7;
      box.innerHTML = `
        <label class="block text-[10px] text-slate-400 font-bold mb-1">Semester:</label>
        <select id="param-sem" onchange="filterTabelRekap()" class="w-full p-2 rounded-xl bg-slate-900 border border-teal-800 text-white text-xs outline-none focus:border-teal-400">
          <option value="ganjil" ${isGanjil?'selected':''}>Semester Ganjil (Jul - Des)</option>
          <option value="genap" ${!isGanjil?'selected':''}>Semester Genap (Jan - Jun)</option>
        </select>
      `;
    } else if (tipe === 'tahun') {
      box.innerHTML = `
        <label class="block text-[10px] text-slate-400 font-bold mb-1">Tahun:</label>
        <select id="param-thn" onchange="filterTabelRekap()" class="w-full p-2 rounded-xl bg-slate-900 border border-teal-800 text-white text-xs outline-none focus:border-teal-400">
          <option value="2026" selected>2026</option>
          <option value="2027">2027</option>
        </select>
      `;
    }
  }

  function normalisasiTanggalLog(tglStr) {
    if (!tglStr) return "";
    if (tglStr.includes('T')) tglStr = tglStr.split('T')[0];
    const p = tglStr.split(/[-/]/);
    if (p.length === 3) {
      if (p[0].length === 4) {
        return `${p[0]}-${String(p[1]).padStart(2, '0')}-${String(p[2]).padStart(2, '0')}`;
      } else if (p[2].length === 4) {
        return `${p[2]}-${String(p[1]).padStart(2, '0')}-${String(p[0]).padStart(2, '0')}`;
      }
    }
    return tglStr;
  }

  function filterTabelRekap() {
    if (!dataServerPresensi.riwayatLog) return;

    const tipePeriode = document.getElementById('filter-periode-tipe').value;
    const statusFilter = document.getElementById('filter-rekap-status').value;
    const namaFilter = (document.getElementById('filter-rekap-nama').value || "").toLowerCase().trim();

    const filtered = dataServerPresensi.riwayatLog.filter(log => {
      let cocokWaktu = true;
      const tglBersih = normalisasiTanggalLog(log.tanggal);
      const parts = tglBersih.split('-');
      const thn = parts[0];
      const bln = parts[1];

      if (tipePeriode === 'hari') {
        const tglInput = document.getElementById('param-tgl') ? document.getElementById('param-tgl').value : "";
        if (tglInput) cocokWaktu = (tglBersih === tglInput);
      } else if (tipePeriode === 'bulan') {
        const blnInput = document.getElementById('param-bln') ? document.getElementById('param-bln').value : "";
        if (blnInput) cocokWaktu = (bln === blnInput);
      } else if (tipePeriode === 'semester') {
        const semInput = document.getElementById('param-sem') ? document.getElementById('param-sem').value : "ganjil";
        const m = parseInt(bln, 10);
        cocokWaktu = (semInput === 'ganjil') ? (m >= 7 && m <= 12) : (m >= 1 && m <= 6);
      } else if (tipePeriode === 'tahun') {
        const thnInput = document.getElementById('param-thn') ? document.getElementById('param-thn').value : "2026";
        cocokWaktu = (thn === thnInput);
      }

      const cocokStatus = (statusFilter === 'semua' || log.status === statusFilter);
      const cocokNama = log.nama.toLowerCase().includes(namaFilter);

      return cocokWaktu && cocokStatus && cocokNama;
    });

    let countTepat = 0, countTelat = 0;
    filtered.forEach(item => {
      if (item.status === 'Terlambat') countTelat++;
      else countTepat++;
    });

    document.getElementById('metric-total-hadir').innerText = filtered.length;
    document.getElementById('metric-tepat-waktu').innerText = countTepat;
    document.getElementById('metric-terlambat').innerText = countTelat;

    const tbody = document.getElementById('tbody-rekap-guru');
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500 italic">Tidak ada catatan presensi pada periode ini.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(log => {
      const jam = log.waktuPenuh.includes(' ') ? log.waktuPenuh.split(' ')[1] : log.waktuPenuh;
      return `
        <tr class="hover:bg-teal-950/30 transition">
          <td class="p-2.5 font-mono text-slate-300">${log.tanggal}</td>
          <td class="p-2.5 font-bold text-white">${log.nama}</td>
          <td class="p-2.5 font-mono text-teal-300">${jam}</td>
          <td class="p-2.5 text-slate-400">${log.tipe}</td>
          <td class="p-2.5 text-center">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${log.status === 'Terlambat' ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}">
              ${log.status}
            </span>
          </td>
        </tr>
      `;
    }).join('');
  }

  function cetakLaporanGuru() {
    const tipe = document.getElementById('filter-periode-tipe').options[document.getElementById('filter-periode-tipe').selectedIndex].text;
    const tglCetak = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

    document.getElementById('pr-periode-info').innerText = `Rentang: ${tipe} • Dicetak: ${tglCetak}`;
    document.getElementById('pr-titi-mangsa').innerText = `Bandar Lampung, ${tglCetak}`;

    const barisTabel = document.getElementById('tbody-rekap-guru').innerHTML;
    document.getElementById('pr-konten-tabel').innerHTML = `
      <table style="width:100%; border-collapse:collapse; font-size:11px; margin-top:10px;">
        <thead>
          <tr style="background:#f1f5f9;">
            <th style="padding:6px; border:1px solid #333;">Tanggal</th>
            <th style="padding:6px; border:1px solid #333;">Nama Lengkap</th>
            <th style="padding:6px; border:1px solid #333;">Waktu Presensi</th>
            <th style="padding:6px; border:1px solid #333;">Tipe</th>
            <th style="padding:6px; border:1px solid #333;">Status</th>
          </tr>
        </thead>
        <tbody>
          ${barisTabel}
        </tbody>
      </table>
    `;

    window.print();
  }
</script>
