<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NalarSci Kids - Magic Catch</title>
  
  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      text-align: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #ui-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .status-badge {
      background: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      border: 3px solid #ffbc00;
    }
    .score-color { color: #ff3838; }
    .timer-color { color: #2ed573; }
    .brand-color { background: #3742fa; color: white; border: none; font-size: 20px; }

    #basket {
      position: absolute;
      bottom: 25px;
      width: 130px;
      height: 80px;
      transform: translateX(-50%);
      font-size: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      transition: left 0.05s ease-out;
      z-index: 5;
    }
    .item {
      position: absolute;
      font-size: 52px;
      pointer-events: none;
      transform: translateX(-50%);
      z-index: 4;
    }
    #popup {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 38px;
      font-weight: bold;
      color: #fff200;
      text-shadow: 3px 3px 0 #ff3838, -3px -3px 0 #ff3838;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 20;
    }

    /* Video Feed Kamera (Cermin di Pojok Kanan Bawah) */
    #cam-wrapper {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 190px;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #fffa65;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      background: #000;
      z-index: 15;
    }
    #input-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efek Mirror agar intuitif */
    }
    #cam-label {
      position: absolute;
      top: 5px;
      left: 8px;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* Layar Hasil (Game Over) */
    #gameover-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .card-result {
      background: white;
      padding: 30px 50px;
      border-radius: 30px;
      border: 6px solid #fffa65;
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .card-result h1 { font-size: 44px; color: #ff3838; margin: 0 0 10px 0; }
    .final-score { font-size: 34px; color: #1e90ff; margin: 15px 0 25px 0; font-weight: bold; }
    .btn-restart {
      background: #2ed573;
      color: white;
      font-size: 24px;
      font-weight: bold;
      padding: 12px 35px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 0 #26af5f;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="ui-bar">
    <div class="status-badge brand-color">🚀 NalarSci Magic Play</div>
    <div class="status-badge timer-color">⏳ <span id="timer">30</span>s</div>
    <div class="status-badge score-color">⭐ Skor: <span id="score">0</span></div>
  </div>

  <div id="popup">HEBAT! 🎉</div>
  <div id="basket">🧺</div>

  <!-- Pratinjau Kamera AiO -->
  <div id="cam-wrapper">
    <video id="input-video" playsinline></video>
    <div id="cam-label">📹 Lambaikan Tangan</div>
  </div>

  <!-- Modal Layar Selesai -->
  <div id="gameover-screen">
    <div class="card-result">
      <h1>WAKTU HABIS! 🥳</h1>
      <div style="font-size: 55px;">⭐ 🏆 ⭐</div>
      <div class="final-score">Skor Kamu: <span id="final-score-val">0</span></div>
      <button class="btn-restart" onclick="restartGame()">Main Lagi (Pencet Spasi)</button>
    </div>
  </div>
</div>

<script>
  const container = document.getElementById('game-container');
  const basket = document.getElementById('basket');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const popup = document.getElementById('popup');
  const gameOverScreen = document.getElementById('gameover-screen');
  const finalScoreVal = document.getElementById('final-score-val');
  const videoElement = document.getElementById('input-video');

  let score = 0;
  let timeLeft = 30;
  let isGameOver = false;
  let spawnInterval = null;
  let timerInterval = null;

  let basketX = window.innerWidth / 2;
  const emojis = ['⭐', '🍎', '🍓', '🍌', '🍭', '🎈'];
  const pujian = ['HEBAT! 🎉', 'PINTAR! 🌟', 'KEREN! 🚀', 'MANTAP! 👏'];
  const keys = {};

  // Audio Sintetis
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playCatchSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playFinishSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [261.63, 329.63, 392.00, 523.25];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.12);
      osc.stop(audioCtx.currentTime + idx * 0.12 + 0.25);
    });
  }

  // 1. INPUT MOUSE (Langsung Menimpa Posisi Keranjang)
  window.addEventListener('mousemove', (e) => {
    if (!isGameOver) {
      basketX = e.clientX;
      clampAndRenderBasket();
    }
  });

  // 2. INPUT KEYBOARD (Panah & Tombol Spasi)
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.code === 'Space' && isGameOver) {
      restartGame();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });

  function handleKeyboard() {
    if (!isGameOver) {
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        basketX -= 25;
        clampAndRenderBasket();
      }
      if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        basketX += 25;
        clampAndRenderBasket();
      }
    }
    requestAnimationFrame(handleKeyboard);
  }
  requestAnimationFrame(handleKeyboard);

  function clampAndRenderBasket() {
    if (basketX < 65) basketX = 65;
    if (basketX > window.innerWidth - 65) basketX = window.innerWidth - 65;
    basket.style.left = basketX + 'px';
  }

  // 3. INPUT KAMERA DENGAN MEDIAPIPE HANDS
  function onHandResults(results) {
    if (isGameOver) return;
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      // Ambil tangan pertama yang terdeteksi, titik landmark 9 (tengah telapak)
      const hand = results.multiHandLandmarks[0];
      const palmX = hand[9].x; 
      // Karena kamera dimirror (scaleX -1), kita balik koordinat X (1 - palmX)
      basketX = (1 - palmX) * window.innerWidth;
      clampAndRenderBasket();
    }
  }

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0, // 0 = Paling ringan & cepat untuk AiO
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  hands.onResults(onHandResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await hands.send({ image: videoElement });
    },
    width: 320,
    height: 240
  });
  camera.start();

  // MEKANIKA GAME
  function showPujian() {
    popup.innerText = pujian[Math.floor(Math.random() * pujian.length)];
    popup.style.opacity = '1';
    popup.style.transform = 'translate(-50%, -60%) scale(1.3)';
    setTimeout(() => {
      popup.style.opacity = '0';
      popup.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 400);
  }

  function spawnItem() {
    if (isGameOver) return;
    const item = document.createElement('div');
    item.className = 'item';
    item.innerText = emojis[Math.floor(Math.random() * emojis.length)];

    const startX = Math.random() * (window.innerWidth - 130) + 65;
    item.style.left = startX + 'px';
    item.style.top = '-60px';
    container.appendChild(item);

    let posY = -60;
    const speed = 3.5 + Math.random() * 2;

    function fall() {
      if (isGameOver) {
        item.remove();
        return;
      }

      posY += speed;
      item.style.top = posY + 'px';

      const itemRect = item.getBoundingClientRect();
      const basketRect = basket.getBoundingClientRect();

      const isColliding = (
        itemRect.bottom >= basketRect.top + 20 &&
        itemRect.top <= basketRect.bottom &&
        itemRect.right >= basketRect.left &&
        itemRect.left <= basketRect.right
      );

      if (isColliding) {
        score += 10;
        scoreEl.innerText = score;
        playCatchSound();
        showPujian();
        item.remove();
        return;
      }

      if (posY > window.innerHeight) {
        item.remove();
      } else {
        requestAnimationFrame(fall);
      }
    }
    requestAnimationFrame(fall);
  }

  function startGame() {
    score = 0;
    timeLeft = 30;
    isGameOver = false;
    scoreEl.innerText = score;
    timerEl.innerText = timeLeft;
    gameOverScreen.style.display = 'none';
    basketX = window.innerWidth / 2;
    clampAndRenderBasket();

    spawnInterval = setInterval(spawnItem, 800);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerEl.innerText = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    isGameOver = true;
    clearInterval(spawnInterval);
    clearInterval(timerInterval);
    playFinishSound();
    finalScoreVal.innerText = score;
    gameOverScreen.style.display = 'flex';
  }

  function restartGame() {
    startGame();
  }

  startGame();
</script>

</body>
</html>
