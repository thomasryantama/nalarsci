<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mengarahkan...</title>
  <script>
    // Ambil path URL yang diketik (misal: /kesiswaan)
    var path = window.location.pathname;
    
    // Jika tidak diakhiri .html dan bukan root, tambahkan .html secara otomatis di balik layar
    if (!path.endsWith('.html') && !path.endsWith('/')) {
      window.location.replace(path + '.html' + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
</body>
</html>
