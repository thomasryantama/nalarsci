<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Buku Karakter Building - SD Methodist Immanuel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 80%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .font-title { font-family: 'Fredoka', sans-serif; }
    .book-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .book-card:hover {
      transform: translateY(-6px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="p-4 sm:p-8 flex flex-col justify-between max-w-6xl mx-auto min-h-screen">

  <!-- HEADER -->
  <header class="text-center max-w-2xl mx-auto mb-8">
    <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-400/20 text-amber-300 px-3.5 py-1 rounded-full text-xs font-black uppercase tracking-wider mb-3">
      📖 Ekosistem Literasi & Budi Pekerti
    </div>
    <h1 class="font-title text-3xl sm:text-4xl text-white mb-2">Rak Buku Pembiasaan Karakter</h1>
    <p class="text-slate-400 text-xs sm:text-sm">
      Pilih jenjang kelas atau buku panduan di bawah untuk membaca langsung di layar Smart TV atau perangkat Anda lembar per lembar.
    </p>
  </header>

  <!-- GRID 12 BUKU -->
  <main class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6 flex-grow mb-10">

    <!-- BUKU 1 S/D 12 -->
    <!-- Template JS Render agar mudah diatur -->
    <script>
      const books = [
        { id: '1', title: 'Kelas 1 (Fase A)', sub: 'Semester 1', icon: '🌱', color: 'from-emerald-500/20 to-emerald-950/40', border: 'border-emerald-500/30', file: 'buku-1.pdf' },
        { id: '2', title: 'Kelas 1 (Fase A)', sub: 'Semester 2', icon: '🌿', color: 'from-emerald-500/20 to-emerald-950/40', border: 'border-emerald-500/30', file: 'buku-2.pdf' },
        { id: '3', title: 'Kelas 2 (Fase A)', sub: 'Semester 1', icon: '🌻', color: 'from-teal-500/20 to-teal-950/40', border: 'border-teal-500/30', file: 'buku-3.pdf' },
        { id: '4', title: 'Kelas 2 (Fase A)', sub: 'Semester 2', icon: '🌼', color: 'from-teal-500/20 to-teal-950/40', border: 'border-teal-500/30', file: 'buku-4.pdf' },
        { id: '5', title: 'Kelas 3 (Fase B)', sub: 'Semester 1', icon: '📘', color: 'from-sky-500/20 to-sky-950/40', border: 'border-sky-500/30', file: 'buku-5.pdf' },
        { id: '6', title: 'Kelas 3 (Fase B)', sub: 'Semester 2', icon: '🌊', color: 'from-sky-500/20 to-sky-950/40', border: 'border-sky-500/30', file: 'buku-6.pdf' },
        { id: '7', title: 'Kelas 4 (Fase B)', sub: 'Semester 1', icon: '🦅', color: 'from-blue-500/20 to-blue-950/40', border: 'border-blue-500/30', file: 'buku-7.pdf' },
        { id: '8', title: 'Kelas 4 (Fase B)', sub: 'Semester 2', icon: '⭐', color: 'from-blue-500/20 to-blue-950/40', border: 'border-blue-500/30', file: 'buku-8.pdf' },
        { id: '9', title: 'Kelas 5 (Fase C)', sub: 'Semester 1', icon: '🚀', color: 'from-indigo-500/20 to-indigo-950/40', border: 'border-indigo-500/30', file: 'buku-9.pdf' },
        { id: '10', title: 'Kelas 5 (Fase C)', sub: 'Semester 2', icon: '🪐', color: 'from-indigo-500/20 to-indigo-950/40', border: 'border-indigo-500/30', file: 'buku-10.pdf' },
        { id: '11', title: 'Kelas 6 (Fase C)', sub: 'Semester 1', icon: '🏆', color: 'from-amber-500/20 to-amber-950/40', border: 'border-amber-500/30', file: 'buku-11.pdf' },
        { id: '12', title: 'Kelas 6 (Fase C)', sub: 'Semester 2', icon: '👑', color: 'from-amber-500/20 to-amber-950/40', border: 'border-amber-500/30', file: 'buku-12.pdf' },
      ];

      document.write(books.map(b => `
        <div class="book-card rounded-2xl p-4 sm:p-5 flex flex-col justify-between bg-gradient-to-br ${b.color} border ${b.border}">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-3xl sm:text-4xl">${b.icon}</span>
              <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-slate-900/80 text-slate-300 border border-slate-700">
                Buku #${b.id}
              </span>
            </div>
            <h3 class="font-title text-base sm:text-lg text-white font-bold leading-tight mt-1">${b.title}</h3>
            <p class="text-[11px] text-slate-300 font-semibold mb-4">${b.sub}</p>
          </div>
          <a href="baca.html?file=${b.file}&judul=${encodeURIComponent(b.title + ' - ' + b.sub)}" 
             class="w-full py-2 bg-slate-900/90 hover:bg-sky-600 text-sky-300 hover:text-white border border-sky-400/30 hover:border-sky-400 font-title text-xs font-bold rounded-xl text-center shadow transition flex items-center justify-center gap-1.5">
            📖 Buka Buku
          </a>
        </div>
      `).join(''));
    </script>

  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-800/80 pt-5 text-center text-xs text-slate-500">
    SD Methodist Immanuel • Dikembangkan oleh <span class="text-slate-400 font-bold">Thomas Ryantama, M.Kom., Gr.</span> (nalarsci.id)
  </footer>

</body>
</html>
