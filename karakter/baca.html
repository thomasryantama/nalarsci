<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pembaca Buku Digital Karakter</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Mozilla PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #0b1120;
      color: #f8fafc;
      overflow: hidden;
      touch-action: pan-x pan-y;
      user-select: none;
    }
    #canvas-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      overflow: auto;
      padding: 16px;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    canvas {
      box-shadow: 0 20px 45px rgba(0,0,0,0.7);
      border-radius: 8px;
      background: white;
      transition: box-shadow 0.2s ease;
    }
    #canvas-container::-webkit-scrollbar { width: 6px; height: 6px; }
    #canvas-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
    
    @media print {
      body { background: white !important; padding: 0 !important; }
      header, footer, button, #loading, .no-print { display: none !important; }
      #print-page-wrapper { display: flex !important; align-items: center; justify-content: center; width: 100%; height: 100%; }
      #img-print-target { width: 100% !important; max-width: 100% !important; height: auto !important; }
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen justify-between">

  <!-- ================= TOP BAR ================= -->
  <header class="bg-slate-900/95 border-b border-slate-800 px-3 sm:px-4 py-2 flex items-center justify-between z-20 backdrop-blur no-print">
    <div class="flex items-center gap-2 sm:gap-3">
      <a href="index.html" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition flex items-center gap-1">
        <span>⬅️</span> <span class="hidden sm:inline">Rak Buku</span>
      </a>
      <div>
        <h1 id="book-title-display" class="text-xs sm:text-sm font-black text-amber-400 leading-tight truncate max-w-[140px] sm:max-w-xs md:max-w-md">Buku Pembiasaan Karakter</h1>
        <!-- STATUS TERAKHIR DIBACA -->
        <p id="info-terakhir-baca" class="text-[10px] text-slate-400 flex items-center gap-1">
          <i class="fa-regular fa-bookmark text-teal-400"></i> Memuat riwayat baca...
        </p>
      </div>
    </div>

    <!-- PENGATUR ZOOM (DIPERTARIK & MUDAH DIBACA GURU SENIOR) & CETAK -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- Tombol Zoom Cepat Guru Senior -->
      <button onclick="setZoomMode('besar')" class="px-2.5 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-xl text-[11px] font-black transition flex items-center gap-1" title="Mode Tulisan Besar untuk Guru">
        <span>🔍👓</span> <span class="hidden md:inline">Teks Besar</span>
      </button>

      <div class="flex items-center bg-slate-800/90 border border-slate-700 rounded-xl p-0.5">
        <button onclick="zoomOut()" class="px-2 py-1 text-slate-300 hover:text-white text-xs font-bold transition" title="Perkecil">">−</button>
        <button onclick="zoomReset()" id="btn-zoom-label" class="px-2 py-1 text-[11px] font-bold text-amber-300 transition" title="Pas Layar">100%</button>
        <button onclick="zoomIn()" class="px-2 py-1 text-slate-300 hover:text-white text-xs font-bold transition" title="Perbesar">+</button>
      </div>

      <!-- Tombol Cetak Halaman Aktif -->
      <button onclick="cetakHalamanAktif()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-teal-300 hover:text-teal-200 border border-teal-800 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow" title="Cetak Lembar Halaman Ini">
        <i class="fa-solid fa-print"></i> <span class="hidden sm:inline">Cetak Hal. Ini</span>
      </button>

      <!-- Tombol Layar Penuh TV -->
      <button onclick="toggleFullscreen()" class="px-2.5 py-1.5 bg-sky-600 hover:bg-sky-500 rounded-xl text-xs font-bold text-white shadow transition" title="Layar Penuh TV">
        ⛶
      </button>
    </div>
  </header>

  <!-- ================= AREA BACA CANVAS ================= -->
  <main class="relative flex-1 w-full overflow-hidden bg-slate-950 flex items-center justify-center" id="main-area">
    
    <div id="loading" class="absolute flex flex-col items-center gap-2 text-slate-400 text-xs z-30">
      <div class="w-9 h-9 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
      <span id="loading-text" class="font-bold">Membuka lembaran buku dengan kualitas tinggi...</span>
    </div>

    <!-- NOTIFIKASI RESUME HALAMAN TERAKHIR -->
    <div id="toast-resume" class="absolute top-4 bg-slate-900/95 border border-teal-500/50 text-white px-4 py-2.5 rounded-2xl shadow-2xl z-20 flex items-center gap-3 backdrop-blur hidden no-print">
      <div class="text-base">🔖</div>
      <div class="text-xs">
        <p class="font-bold text-teal-300" id="resume-text">Lanjutkan membaca halaman 1?</p>
        <p class="text-[10px] text-slate-400" id="resume-time">-</p>
      </div>
      <button onclick="tutupToastResume(true)" class="bg-teal-600 hover:bg-teal-500 px-2.5 py-1 rounded-lg text-xs font-bold text-white transition">Buka</button>
      <button onclick="tutupToastResume(false)" class="text-slate-400 hover:text-white text-xs px-1">✕</button>
    </div>

    <!-- CANVAS WRAPPER (BISA DIGESER DENGAN MOUSE/TOUCH SAAT ZOOM) -->
    <div id="canvas-container">
      <canvas id="pdf-canvas"></canvas>
    </div>

    <!-- TOMBOL SAMPING NAVIGASI CEPAT -->
    <button onclick="prevPage()" class="hidden sm:flex absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-slate-900/80 hover:bg-slate-800 border border-slate-700 text-white rounded-full items-center justify-center text-xl shadow-2xl transition hover:scale-110 z-10 no-print">❮</button>
    <button onclick="nextPage()" class="hidden sm:flex absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-slate-900/80 hover:bg-slate-800 border border-slate-700 text-white rounded-full items-center justify-center text-xl shadow-2xl transition hover:scale-110 z-10 no-print">❯</button>

  </main>

  <!-- ================= BOTTOM BAR ================= -->
  <footer class="bg-slate-900/95 border-t border-slate-800 px-4 py-2 flex items-center justify-between z-20 backdrop-blur no-print">
    <button onclick="prevPage()" id="btn-prev" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs font-bold rounded-xl transition flex items-center gap-1.5 border border-slate-700">
      <span>⬅️</span> <span class="hidden sm:inline">Sebelumnya</span>
    </button>

    <div class="flex items-center gap-2 text-xs font-bold">
      <span class="text-slate-400">Hal.</span>
      <input type="number" id="page-num" value="1" min="1" 
             class="w-12 text-center bg-slate-950 border border-slate-700 text-amber-400 rounded-lg py-1 font-mono text-xs focus:border-amber-400 outline-none"
             onchange="goToPage(this.value)">
      <span class="text-slate-400">/ <span id="page-count" class="text-slate-200">...</span></span>
    </div>

    <button onclick="nextPage()" id="btn-next" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 disabled:opacity-40 text-xs font-bold rounded-xl transition flex items-center gap-1.5 shadow">
      <span class="hidden sm:inline">Berikutnya</span> <span>➡️</span>
    </button>
  </footer>

  <!-- ================= AREA CETAK TUNGGAL SATU HALAMAN (PRINT ONLY) ================= -->
  <div id="print-page-wrapper" class="hidden">
    <img id="img-print-target" alt="Halaman PDF Siap Cetak">
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // BACA PARAMETER DARI URL: ?file=buku-1.pdf&judul=Buku%20Karakter%20Kelas%201
    const urlParams = new URLSearchParams(window.location.search);
    const pdfFileName = urlParams.get('file') || 'buku-1.pdf';
    const bookTitle = urlParams.get('judul') || 'Buku Pembiasaan Karakter';

    document.getElementById('book-title-display').innerText = bookTitle;
    document.title = bookTitle + " — Pembaca Digital";

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scaleMultiplier = 1.0; // Faktor pengali zoom (1.0 = normal pas layar)
    let pendingResumePage = 1;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const STORAGE_KEY = 'baca_karakter_' + encodeURIComponent(pdfFileName);

    // ================= 1. MEMUAT DOKUMEN & RIWAYAT TERAKHIR BACA =================
    pdfjsLib.getDocument(pdfFileName).promise.then(doc => {
      pdfDoc = doc;
      document.getElementById('page-count').innerText = doc.numPages;
      document.getElementById('page-num').max = doc.numPages;
      document.getElementById('loading').classList.add('hidden');

      // Periksa apakah sebelumnya sudah pernah dibaca
      cekRiwayatTerakhirBaca();
      renderPage(pageNum);
    }).catch(err => {
      document.getElementById('loading').innerHTML = `
        <div class="text-rose-400 font-bold mb-1">⚠️ Berkas PDF Belum Ditemukan</div>
        <p class="text-[11px] text-slate-400 text-center max-w-xs">
          Pastikan berkas <b>${pdfFileName}</b> sudah berada di folder proyek GitHub Anda.
        </p>
        <a href="index.html" class="mt-3 px-3 py-1.5 bg-slate-800 text-xs text-sky-400 rounded-lg border border-slate-700">Kembali ke Rak Buku</a>
      `;
    });

    // ================= 2. LOGIKA PENYIMPANAN JEJAK BACA (LOCALSTORAGE) =================
    function simpanJejakBaca(hal) {
      const now = new Date();
      const jamStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':') + " WIB";
      const tglStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

      const dataJejak = {
        halaman: hal,
        waktuStr: `${tglStr}, ${jamStr}`,
        timestamp: now.getTime()
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(dataJejak));
      updateLabelStatusBaca(hal, dataJejak.waktuStr);
    }

    function cekRiwayatTerakhirBaca() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        document.getElementById('info-terakhir-baca').innerHTML = `<i class="fa-regular fa-bookmark text-slate-500"></i> Baru pertama dibuka`;
        return;
      }

      try {
        const obj = JSON.parse(saved);
        if (obj.halaman && obj.halaman > 1 && obj.halaman <= pdfDoc.numPages) {
          pendingResumePage = obj.halaman;
          document.getElementById('resume-text').innerText = `Lanjut membaca Halaman ${obj.halaman}?`;
          document.getElementById('resume-time').innerText = `Terakhir dibaca: ${obj.waktuStr}`;
          document.getElementById('toast-resume').classList.remove('hidden');
        }
        updateLabelStatusBaca(obj.halaman, obj.waktuStr);
      } catch (e) {}
    }

    function updateLabelStatusBaca(hal, waktuStr)
