<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pembaca Buku Digital Karakter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Mozilla PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
    }
    #canvas-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      overflow: auto;
      padding: 10px;
    }
    canvas {
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border-radius: 8px;
      max-width: 100%;
      height: auto;
      background: white;
    }
    #canvas-container::-webkit-scrollbar { display: none; }
    #canvas-container { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex flex-col h-screen w-screen justify-between">

  <!-- TOP BAR -->
  <header class="bg-slate-900/95 border-b border-slate-800 px-3 sm:px-4 py-2.5 flex items-center justify-between z-20 backdrop-blur">
    <div class="flex items-center gap-2">
      <a href="index.html" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition flex items-center gap-1">
        <span>⬅️</span> <span class="hidden sm:inline">Rak Buku</span>
      </a>
      <div>
        <h1 id="book-title-display" class="text-xs sm:text-sm font-black text-amber-400 leading-tight truncate max-w-[180px] sm:max-w-md">Buku Pembiasaan Karakter</h1>
        <p class="text-[10px] text-slate-400">Panduan Harian Wali Kelas</p>
      </div>
    </div>

    <!-- PENGATUR ZOOM & FULLSCREEN -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button onclick="zoomOut()" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-200 border border-slate-700" title="Perkecil">🔍−</button>
      <button onclick="zoomReset()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-[11px] font-bold text-slate-300 border border-slate-700" title="Pas Layar">Fit</button>
      <button onclick="zoomIn()" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-200 border border-slate-700" title="Perbesar">🔍+</button>
      <button onclick="toggleFullscreen()" class="px-2.5 py-1 bg-sky-600 hover:bg-sky-500 rounded-lg text-[11px] font-bold text-white shadow" title="Layar Penuh TV">⛶ Layar TV</button>
    </div>
  </header>

  <!-- AREA BACA -->
  <main class="relative flex-1 w-full overflow-hidden bg-slate-950 flex items-center justify-center" id="main-area">
    
    <div id="loading" class="absolute flex flex-col items-center gap-2 text-slate-400 text-xs">
      <div class="w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
      <span id="loading-text">Membuka lembaran buku...</span>
    </div>

    <div id="canvas-container">
      <canvas id="pdf-canvas"></canvas>
    </div>

    <!-- TOMBOL SAMPING -->
    <button onclick="prevPage()" class="hidden sm:flex absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-slate-900/80 hover:bg-slate-800 border border-slate-700 text-white rounded-full items-center justify-center text-xl shadow-2xl transition hover:scale-110">❮</button>
    <button onclick="nextPage()" class="hidden sm:flex absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-slate-900/80 hover:bg-slate-800 border border-slate-700 text-white rounded-full items-center justify-center text-xl shadow-2xl transition hover:scale-110">❯</button>

  </main>

  <!-- BOTTOM BAR -->
  <footer class="bg-slate-900/95 border-t border-slate-800 px-4 py-2 flex items-center justify-between z-20 backdrop-blur">
    <button onclick="prevPage()" id="btn-prev" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs font-bold rounded-xl transition flex items-center gap-1.5 border border-slate-700">
      <span>⬅️</span> <span class="hidden sm:inline">Sebelumnya</span>
    </button>

    <div class="flex items-center gap-2 text-xs font-bold">
      <span class="text-slate-400">Hal.</span>
      <input type="number" id="page-num" value="1" min="1" 
             class="w-12 text-center bg-slate-950 border border-slate-700 text-amber-400 rounded-lg py-1 font-mono text-xs focus:border-amber-400 outline-none"
             onchange="goToPage(this.value)">
      <span class="text-slate-400">/ <span id="page-count" class="text-slate-200">...</span></span>
    </div>

    <button onclick="nextPage()" id="btn-next" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 disabled:opacity-40 text-xs font-bold rounded-xl transition flex items-center gap-1.5 shadow">
      <span class="hidden sm:inline">Berikutnya</span> <span>➡️</span>
    </button>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // BACA PARAMETER DARI URL: ?file=buku-1.pdf&judul=Kelas%201
    const urlParams = new URLSearchParams(window.location.search);
    const pdfFileName = urlParams.get('file') || 'buku-1.pdf';
    const bookTitle = urlParams.get('judul') || 'Buku Pembiasaan Karakter';

    document.getElementById('book-title-display').innerText = bookTitle;
    document.title = bookTitle + " - Pembaca Digital";

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.0;
    let baseScale = 1.0;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    // Muat PDF dinamis sesuai parameter file
    pdfjsLib.getDocument(pdfFileName).promise.then(doc => {
      pdfDoc = doc;
      document.getElementById('page-count').innerText = doc.numPages;
      document.getElementById('page-num').max = doc.numPages;
      document.getElementById('loading').classList.add('hidden');
      renderPage(pageNum);
    }).catch(err => {
      document.getElementById('loading').innerHTML = `
        <div class="text-rose-400 font-bold mb-1">⚠️ Berkas Belum Ditemukan</div>
        <p class="text-[11px] text-slate-400 text-center max-w-xs">
          Pastikan file <b>${pdfFileName}</b> sudah diunggah di folder <code>karakter/</code> repositori Anda.
        </p>
        <a href="index.html" class="mt-3 px-3 py-1.5 bg-slate-800 text-xs text-sky-400 rounded-lg border border-slate-700">Kembali ke Rak Buku</a>
      `;
    });

    function renderPage(num) {
      pageRendering = true;
      document.getElementById('loading').classList.remove('hidden');

      pdfDoc.getPage(num).then(page => {
        const container = document.getElementById('canvas-container');
        const viewportUnscaled = page.getViewport({ scale: 1.0 });

        const availableWidth = container.clientWidth - 20;
        const availableHeight = container.clientHeight - 20;

        const scaleX = availableWidth / viewportUnscaled.width;
        const scaleY = availableHeight / viewportUnscaled.height;
        baseScale = Math.min(scaleX, scaleY);

        const currentScale = baseScale * scale;
        const viewport = page.getViewport({ scale: currentScale });

        const outputScale = window.devicePixelRatio || 1;
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderContext = {
          canvasContext: ctx,
          transform: transform,
          viewport: viewport
        };

        const renderTask = page.render(renderContext);

        renderTask.promise.then(() => {
          pageRendering = false;
          document.getElementById('loading').classList.add('hidden');

          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });

      document.getElementById('page-num').value = num;
      document.getElementById('btn-prev').disabled = (num <= 1);
      document.getElementById('btn-next').disabled = (num >= pdfDoc.numPages);
    }

    function queueRenderPage(num) {
      if (pageRendering) pageNumPending = num;
      else renderPage(num);
    }

    function prevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    function nextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    function goToPage(val) {
      const p = parseInt(val);
      if (p >= 1 && p <= pdfDoc.numPages) {
        pageNum = p;
        queueRenderPage(pageNum);
      }
    }

    function zoomIn() { scale = Math.min(scale + 0.25, 2.5); renderPage(pageNum); }
    function zoomOut() { scale = Math.max(scale - 0.25, 0.75); renderPage(pageNum); }
    function zoomReset() { scale = 1.0; renderPage(pageNum); }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') nextPage();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
    });

    let touchStartX = 0, touchEndX = 0;
    const mainArea = document.getElementById('main-area');
    mainArea.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    mainArea.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      if (Math.abs(swipeDistance) > 50) {
        if (swipeDistance < 0) nextPage();
        else prevPage();
      }
    }

    window.addEventListener('resize', () => { if (pdfDoc) renderPage(pageNum); });
  </script>
</body>
</html>
